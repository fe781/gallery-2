<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web/Apps & Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .right-section {
      width: 480px;
      background-image: url("https://i.pinimg.com/736x/cb/a2/f6/cba2f6cd30ff85fc5f61338d4327f35f.jpg");
      background-size: cover;
      background-position: center;
      border: 4px solid #b8a1ec;
      border-radius: 16px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 8px 24px rgba(184, 161, 236, 0.2);
    }

    /* Web/Apps section */
    .study-title {
      color: #3b508f;
      font-family: 'Fredoka', sans-serif;
      font-size: 30px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .web-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .web-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 10px 14px;
      text-align: center;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .web-card input {
      width: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #4a5568;
      outline: none;
    }

    /* Gallery section */
    .gallery-container {
      margin-top: 10px;
    }
    .gallery-title {
      color: #3b508f;
      font-family: 'Fredoka', sans-serif;
      font-size: 32px;
      line-height: 1;
    }
    .gallery-subtitle {
      color: #3b508f;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 15px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .gallery-box {
      aspect-ratio: 1 / 1;
      background: rgba(203, 213, 225, 0.85);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed #94a3b8;
      transition: all 0.2s ease;
    }
    .gallery-box:hover {
      background: rgba(203, 213, 225, 0.95);
      border-color: #64748b;
    }
    .gallery-box input[type="file"] {
      display: none;
    }
    .gallery-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }
    .upload-icon {
      font-size: 24px;
      color: #475569;
      margin-bottom: 4px;
    }
    .upload-text {
      font-size: 12px;
      color: #475569;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="right-section">
    <!-- Web/Apps Title -->
    <div class="study-title">web/apps for study</div>

    <!-- 4 Ô điền tên Web/App -->
    <div class="web-grid">
      <div class="web-card"><input type="text" value="ô điền tên web"></div>
      <div class="web-card"><input type="text" value="ô điền tên web"></div>
      <div class="web-card"><input type="text" value="ô điền tên web"></div>
      <div class="web-card"><input type="text" value="ô điền tên web"></div>
    </div>

    <!-- Gallery Section -->
    <div class="gallery-container">
      <div class="gallery-title">Gallery</div>
      <div class="gallery-subtitle">picture for today</div>

      <!-- 4 Ô Ảnh Gallery -->
      <div class="gallery-grid">
        <!-- Ô 1 -->
        <div class="gallery-box" onclick="this.querySelector('input').click()">
          <input type="file" accept="image/*" onchange="previewImage(this)">
          <div class="upload-icon">+</div>
          <div class="upload-text">Tải ảnh lên</div>
          <img style="display:none;" alt="Gallery">
        </div>
        <!-- Ô 2 -->
        <div class="gallery-box" onclick="this.querySelector('input').click()">
          <input type="file" accept="image/*" onchange="previewImage(this)">
          <div class="upload-icon">+</div>
          <div class="upload-text">Tải ảnh lên</div>
          <img style="display:none;" alt="Gallery">
        </div>
        <!-- Ô 3 -->
        <div class="gallery-box" onclick="this.querySelector('input').click()">
          <input type="file" accept="image/*" onchange="previewImage(this)">
          <div class="upload-icon">+</div>
          <div class="upload-text">Tải ảnh lên</div>
          <img style="display:none;" alt="Gallery">
        </div>
        <!-- Ô 4 -->
        <div class="gallery-box" onclick="this.querySelector('input').click()">
          <input type="file" accept="image/*" onchange="previewImage(this)">
          <div class="upload-icon">+</div>
          <div class="upload-text">Tải ảnh lên</div>
          <img style="display:none;" alt="Gallery">
        </div>
      </div>
    </div>
  </div>

  <script>
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const box = input.parentElement;
          const img = box.querySelector('img');
          img.src = e.target.result;
          img.style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>
</body>
</html>
